# Credentials scan workflow
name: Credentials — is anything exposed?

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for the shape of a credential
        run: bash scripts/check-secrets.sh
