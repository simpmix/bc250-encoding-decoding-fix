name: Build & Release BC-250 Drivers

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libva-dev \
          libdrm-dev \
          libvulkan-dev \
          libx264-dev \
          mesa-vulkan-drivers \
          glslang-tools \
          vainfo \
          ffmpeg

    - name: Configure CMake
      run: |
        cmake -B approach1-compute-encoder/build \
              -S approach1-compute-encoder \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=ON

    - name: Build Driver & Compile Shaders
      run: |
        cmake --build approach1-compute-encoder/build --parallel $(nproc)

    - name: Run Test Suite
      run: |
        # No continue-on-error / fallback here on purpose: a real test failure
        # must fail this job. This step used to tolerate failure under the
        # theory that some tests need GPU/Vulkan unavailable in headless CI -
        # verified false by reproducing this exact environment locally
        # (mesa-vulkan-drivers software Vulkan, no /dev/dri): all 4 test
        # binaries, including VaApiDriverTest and EncodeBitstreamTest, pass
        # cleanly headless. See enable_testing() fix in
        # approach1-compute-encoder/CMakeLists.txt for the separate, earlier
        # bug (ctest silently discovering zero tests) this masking was
        # hiding on top of.
        ctest --test-dir approach1-compute-encoder/build --output-on-failure

    - name: Verify Bitstream with FFmpeg Reference Decoder (External Oracle)
      run: |
        echo "Validating generated H.264 stream with FFmpeg reference decoder..."
        BUILD_DIR=approach1-compute-encoder/build
        
        # If ctest already generated the stream, find it; otherwise run test_encode directly
        STREAM_PATH=$(find "$BUILD_DIR" -name "bc250_test_stream.h264" 2>/dev/null | head -n 1)
        
        if [ -z "$STREAM_PATH" ]; then
          echo "Stream not found from ctest run — executing test_encode directly..."
          TEST_BIN=$(find "$BUILD_DIR" -name "test_encode" -type f -executable 2>/dev/null | head -n 1)
          if [ -z "$TEST_BIN" ]; then
            echo "ERROR: test_encode binary not found in $BUILD_DIR"
            find "$BUILD_DIR" -type f -name "test_*" || true
            exit 1
          fi
          (cd "$BUILD_DIR" && "$GITHUB_WORKSPACE/$TEST_BIN")
          STREAM_PATH="$BUILD_DIR/bc250_test_stream.h264"
        fi
        
        if [ ! -f "$STREAM_PATH" ]; then
          echo "ERROR: bc250_test_stream.h264 was not produced!"
          ls -laR "$BUILD_DIR"/tests/ 2>/dev/null || true
          exit 1
        fi
        
        echo "Found test stream at $STREAM_PATH ($(wc -c < "$STREAM_PATH") bytes)"
        ffmpeg -v error -i "$STREAM_PATH" -f null -
        echo "✓ SUCCESS: FFmpeg verified and decoded all frames with ZERO errors!"

        # Content Assertion: Decode stream to raw YUV and verify exact frame count & byte size
        echo "Running Content Assertion: decoding stream to raw YUV420p..."
        ffmpeg -v error -y -vsync 0 -i "$STREAM_PATH" -f rawvideo -pix_fmt yuv420p decoded.yuv
        DECODED_SIZE=$(wc -c < decoded.yuv)
        EXPECTED_SIZE=$((1920 * 1080 * 3 / 2 * 30))
        FRAME_SIZE=$((1920 * 1080 * 3 / 2))
        FRAME_COUNT=$((DECODED_SIZE / FRAME_SIZE))
        echo "Decoded raw YUV size: $DECODED_SIZE bytes ($FRAME_COUNT frames decoded, expected >= 30 frames)"
        if [ "$DECODED_SIZE" -lt "$EXPECTED_SIZE" ]; then
          echo "ERROR: Decoded size too small! Expected at least $EXPECTED_SIZE bytes, got $DECODED_SIZE"
          exit 1
        fi
        rm -f decoded.yuv
        echo "✓ CONTENT ASSERTION PASSED: All $FRAME_COUNT frames decoded and verified with zero errors!"

        # Validate generated H.265/HEVC stream with FFmpeg reference decoder
        echo "Validating generated H.265/HEVC stream with FFmpeg reference decoder..."
        HEVC_STREAM_PATH=$(find "$BUILD_DIR" -name "bc250_test_stream.hevc" 2>/dev/null | head -n 1)
        if [ -z "$HEVC_STREAM_PATH" ]; then
          echo "HEVC stream not found from ctest run — executing test_hevc_encode directly..."
          HEVC_TEST_BIN=$(find "$BUILD_DIR" -name "test_hevc_encode" -type f -executable 2>/dev/null | head -n 1)
          if [ -n "$HEVC_TEST_BIN" ]; then
            (cd "$BUILD_DIR" && "$GITHUB_WORKSPACE/$HEVC_TEST_BIN")
            HEVC_STREAM_PATH="$BUILD_DIR/bc250_test_stream.hevc"
          fi
        fi

        if [ -f "$HEVC_STREAM_PATH" ]; then
          echo "Found HEVC test stream at $HEVC_STREAM_PATH ($(wc -c < "$HEVC_STREAM_PATH") bytes)"
          ffmpeg -v error -i "$HEVC_STREAM_PATH" -f null -
          echo "✓ SUCCESS: FFmpeg verified and decoded all H.265/HEVC frames with ZERO errors!"

          echo "Running HEVC Content Assertion: decoding stream to raw YUV420p..."
          ffmpeg -v error -y -vsync 0 -i "$HEVC_STREAM_PATH" -f rawvideo -pix_fmt yuv420p decoded_hevc.yuv
          HEVC_DECODED_SIZE=$(wc -c < decoded_hevc.yuv)
          HEVC_FRAME_SIZE=$((128 * 96 * 3 / 2))
          HEVC_FRAME_COUNT=$((HEVC_DECODED_SIZE / HEVC_FRAME_SIZE))
          echo "Decoded raw YUV size: $HEVC_DECODED_SIZE bytes ($HEVC_FRAME_COUNT frames decoded, expected 30 frames)"
          if [ "$HEVC_FRAME_COUNT" -lt 30 ]; then
            echo "ERROR: HEVC decoded frames too few! Expected at least 30 frames, got $HEVC_FRAME_COUNT"
            exit 1
          fi
          rm -f decoded_hevc.yuv
          echo "✓ HEVC CONTENT ASSERTION PASSED: All $HEVC_FRAME_COUNT frames decoded and verified with zero errors!"
        else
          echo "WARNING: bc250_test_stream.hevc was not produced."
        fi

    - name: Package Release Bundle
      run: |
        mkdir -p dist/bc250-driver/shaders
        mkdir -p dist/bc250-driver/approach1-compute-encoder/shaders
        
        # Copy compiled driver library (supporting both bc250_drv_video.so and libbc250_drv_video.so)
        if [ -f approach1-compute-encoder/build/bc250_drv_video.so ]; then
          cp approach1-compute-encoder/build/bc250_drv_video.so dist/bc250-driver/
        elif [ -f approach1-compute-encoder/build/libbc250_drv_video.so ]; then
          cp approach1-compute-encoder/build/libbc250_drv_video.so dist/bc250-driver/bc250_drv_video.so
        else
          FOUND_SO=$(find approach1-compute-encoder/build -name "*bc250_drv_video*.so" | head -n 1)
          if [ -n "$FOUND_SO" ]; then
            cp "$FOUND_SO" dist/bc250-driver/bc250_drv_video.so
          else
            echo "ERROR: Could not find bc250_drv_video.so in approach1-compute-encoder/build"
            ls -la approach1-compute-encoder/build/
            exit 1
          fi
        fi
        
        # Copy compiled SPIR-V shaders & GLSL source shaders
        cp approach1-compute-encoder/build/*.spv dist/bc250-driver/shaders/ 2>/dev/null || true
        cp approach1-compute-encoder/build/*.spv dist/bc250-driver/approach1-compute-encoder/shaders/ 2>/dev/null || true
        cp approach1-compute-encoder/shaders/*.comp dist/bc250-driver/shaders/ 2>/dev/null || true
        cp approach1-compute-encoder/shaders/*.comp dist/bc250-driver/approach1-compute-encoder/shaders/ 2>/dev/null || true
        
        # Copy installer, tools, docs, and audio fix
        cp build_and_install.sh dist/bc250-driver/
        cp -r tools dist/bc250-driver/
        cp -r audio-fix dist/bc250-driver/
        cp -r docs dist/bc250-driver/ 2>/dev/null || true
        cp README.md dist/bc250-driver/
        cp LICENSE dist/bc250-driver/
        
        cd dist
        tar -czvf ../bc250-driver-linux-x86_64.tar.gz bc250-driver/
        cd ..

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bc250-driver-linux-x86_64
        path: bc250-driver-linux-x86_64.tar.gz

    - name: Publish GitHub Release (Tags only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bc250-driver-linux-x86_64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 32-bit (i386) companion driver, for 32-bit VA-API clients - Steam Link's
  # runtime is 32-bit and dlopen()s a 32-bit driver, so the x86_64 build above
  # is invisible to it (issue #8). Installs alongside the 64-bit driver in a
  # separate DRI directory; it is a companion, not a standalone install.
  #
  # needs: build is deliberate, not an oversight. Both jobs call
  # action-gh-release on the same tag, and running them concurrently races on
  # creating/updating that one release. Serializing costs ~1 minute on a
  # workflow that takes under two, which is cheaper than a flaky release.
  build32:
    runs-on: ubuntu-22.04
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install 32-bit build dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        # libgomp1:i386 is not optional. Without a SHARED 32-bit libgomp,
        # -fopenmp links the static libgomp.a, whose non-PIC objects leave the
        # driver with DT_TEXTREL - which SELinux deny_execmod refuses to
        # dlopen(), i.e. it would break in Steam Link specifically and nowhere
        # else. CMake links -Wl,-z,text so that fails the build instead.
        sudo apt-get install -y \
          build-essential \
          gcc-multilib \
          cmake \
          pkg-config \
          glslang-tools \
          libva-dev:i386 \
          libdrm-dev:i386 \
          libvulkan-dev:i386 \
          libgomp1:i386

    - name: Configure CMake (32-bit)
      # Tests stay off here: the 64-bit job above already runs the full ctest
      # suite and the ffmpeg decode oracle against identical sources, and the
      # oracle would additionally need a 32-bit ffmpeg. This job exists to
      # prove the i386 driver builds, links, and is loadable.
      run: |
        cmake -B build32 -S approach1-compute-encoder \
              -DBUILD_32BIT=ON \
              -DBUILD_TESTS=OFF \
              -DCMAKE_BUILD_TYPE=Release

    - name: Build 32-bit Driver
      run: cmake --build build32 --parallel $(nproc)

    - name: Verify the artifact is actually i386 and loadable
      # Asserting these rather than trusting the build: a 64-bit .so, or one
      # carrying DT_TEXTREL, would both package and upload perfectly happily
      # and then fail for the one consumer this job exists to serve.
      run: |
        SO=$(find build32 -name 'bc250_drv_video.so' | head -n 1)
        if [ -z "$SO" ]; then echo "ERROR: no bc250_drv_video.so produced"; exit 1; fi
        file "$SO"
        readelf -h "$SO" | grep -E 'Class|Machine'

        readelf -h "$SO" | grep -q 'ELF32' \
          || { echo "ERROR: not ELF32 - a 64-bit driver here is useless to Steam Link"; exit 1; }
        readelf -h "$SO" | grep -qi '80386' \
          || { echo "ERROR: not i386"; exit 1; }

        if readelf -d "$SO" | grep -q TEXTREL; then
          echo "ERROR: DT_TEXTREL present - SELinux deny_execmod will refuse to dlopen() this."
          echo "Cause is almost always a statically linked libgomp (missing libgomp1:i386)."
          exit 1
        fi
        echo "OK: ELF32 i386, no text relocations"
        objdump -p "$SO" | grep NEEDED

    - name: Package 32-bit Bundle
      run: |
        mkdir -p dist32/bc250-driver-i386
        SO=$(find build32 -name 'bc250_drv_video.so' | head -n 1)
        cp "$SO" dist32/bc250-driver-i386/
        cat > dist32/bc250-driver-i386/README-i386.txt <<'EOF'
        32-bit (i386) BC-250 VA-API driver — companion to the 64-bit build.

        For 32-bit VA-API clients; Steam Link is the reason this exists. Its
        runtime is 32-bit and dlopen()s a 32-bit driver, so the x86_64 driver
        is invisible to it and it silently falls back to software encoding.

        This does NOT replace the 64-bit driver — install it alongside, into
        the 32-bit DRI directory:

            sudo install -Dm755 bc250_drv_video.so /usr/lib32/dri/bc250_drv_video.so
            # Debian/Ubuntu multiarch: /usr/lib/i386-linux-gnu/dri/

        Do NOT put it in the 64-bit DRI directory. libva selects by filename,
        so a wrong-arch bc250_drv_video.so there shadows the working 64-bit
        one and breaks every 64-bit client.

        No shaders in this bundle on purpose: the SPIR-V is
        architecture-independent and shared with the 64-bit install
        (/usr/share/bc250/shaders). Install the x86_64 package first, or take
        the shaders from it. A second copy here would only create something
        that can drift against the other .so.
        EOF
        cd dist32
        tar -czvf ../bc250-driver-linux-i386.tar.gz bc250-driver-i386/

    - name: Upload 32-bit Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bc250-driver-linux-i386
        path: bc250-driver-linux-i386.tar.gz

    - name: Publish 32-bit Driver to GitHub Release (Tags only)
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        gh release upload "${{ github.ref_name }}" bc250-driver-linux-i386.tar.gz --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
